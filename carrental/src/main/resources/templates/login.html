
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | CarRental</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        .message {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .error { color: #dc2626; }
        .success { color: #16a34a; }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>
<div class="login-box">

    <h2>Welcome Back</h2>

    <p class="message success"
       th:if="${param.registered}">
        Account created successfully! Please log in.
    </p>

    <p class="message error"
       th:if="${param.error}">
        Invalid email or password.
    </p>

    <p class="message success"
       th:if="${param.logout}">
        You have been logged out successfully.
    </p>

    <form th:action="@{/login}" method="post">

        <label>Email</label>
        <input type="email"
               name="email"
               placeholder="Enter your email"
               required>

        <label>Password</label>
        <input type="password"
               name="password"
               placeholder="Enter your password"
               required>

        <button type="submit">Login</button>
    </form>

    <div class="register-link">
        Don't have an account?
        <a th:href="@{/register}">Register</a>
    </div>

</div>
</body>
</html>
