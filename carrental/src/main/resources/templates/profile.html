<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile | CarRental</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #111827;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .profile-card {
            background: white;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }

        h1 { margin-top: 0; }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .success-message {
            background: #dcfce7;
            border: 1px solid #bbf7d0;
            color: #15803d;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .detail {
            padding: 16px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .detail:last-of-type {
            border-bottom: none;
        }

        .label {
            display: block;
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 6px;
        }

        .value {
            font-size: 16px;
            font-weight: 500;
        }

        .edit-link {
            background: none;
            border: none;
            color: #2563eb;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .edit-link:hover {
            background: #eff6ff;
            text-decoration: underline;
        }

        .license-input {
            flex: 1;
            min-width: 220px;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            color: #111827;
            box-sizing: border-box;
        }

        .license-input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .button {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            background: #111827;
            color: white;
            font-family: inherit;
        }

        .save-btn {
            background: #087f5b;
            padding: 10px 18px;
        }

        .save-btn:hover {
            background: #066849;
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #374151;
            padding: 10px 16px;
        }

        .cancel-btn:hover {
            background: #d1d5db;
        }

        .logout {
            background: #dc2626;
        }

        .logout:hover {
            background: #b91c1c;
        }
    </style>
</head>

<body>

<div th:replace="~{navbar :: navbar}"></div>

<div class="container">
    <div class="profile-card">

        <h1>My Profile</h1>
        <p class="subtitle">
            Manage your CarRental account details.
        </p>

        <p class="success-message"
           th:if="${successMessage}"
           th:text="${successMessage}"></p>

        <div class="detail">
            <span class="label">Full Name</span>
            <span class="value"
                  th:text="${customer.name}"></span>
        </div>

        <div class="detail">
            <span class="label">Email Address</span>
            <span class="value"
                  th:text="${customer.email}"></span>
        </div>

        <div class="detail">
            <span class="label">Phone Number</span>
            <span class="value"
                  th:text="${customer.phone}"></span>
        </div>

        <div class="detail">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <span class="label" style="margin-bottom: 0;">Driving Licence Number</span>
                <button type="button" id="toggleLicenseBtn" class="edit-link" onclick="toggleLicenseForm()">
                    <span th:text="${customer.drivingLicenseNo != null && !customer.drivingLicenseNo.isEmpty() ? 'Change' : 'Set Number'}">Set Number</span>
                </button>
            </div>
            <div id="licenseDisplay" class="value"
                  th:text="${customer.drivingLicenseNo != null && !customer.drivingLicenseNo.isEmpty()
                      ? customer.drivingLicenseNo
                      : 'Not added yet'}"></div>

            <form id="licenseForm" th:action="@{/profile/license}" method="post" style="display: none; margin-top: 10px;">
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <input type="text"
                           name="drivingLicenseNo"
                           id="licenseInput"
                           th:value="${customer.drivingLicenseNo}"
                           placeholder="Enter driving licence number"
                           class="license-input"
                           required>
                    <button type="submit" class="button save-btn">Save</button>
                    <button type="button" class="button cancel-btn" onclick="toggleLicenseForm()">Cancel</button>
                </div>
            </form>
        </div>

        <div class="detail">
            <span class="label">Customer ID</span>
            <span class="value"
                  th:text="${customer.customerId}"></span>
        </div>

        <div class="actions">

            <a th:href="@{/cars}" class="button">
                Browse Cars
            </a>

            <form th:action="@{/logout}" method="post">
                <button type="submit"
                        class="button logout">
                    Logout
                </button>
            </form>

        </div>

    </div>
</div>

<script>
    function toggleLicenseForm() {
        const form = document.getElementById("licenseForm");
        const display = document.getElementById("licenseDisplay");
        const btn = document.getElementById("toggleLicenseBtn");

        if (form.style.display === "none" || form.style.display === "") {
            form.style.display = "block";
            display.style.display = "none";
            btn.style.display = "none";
            const input = document.getElementById("licenseInput");
            input.focus();
            input.select();
        } else {
            form.style.display = "none";
            display.style.display = "block";
            btn.style.display = "inline-block";
        }
    }
</script>

</body>
</html>
