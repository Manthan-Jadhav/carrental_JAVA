
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">


    <title>My Bookings | Car Rental</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f6fa;
            font-family: Arial, sans-serif;
            color: #202735;
        }

        .container {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .booking-card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .booking-id {
            color: #777;
            font-size: 13px;
        }

        .status {
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            background: #fff0cf;
            color: #946000;
        }

        .status.confirmed {
            background: #e1f7e9;
            color: #187a3d;
        }

        .status.cancelled {
            background: #ffe5e5;
            color: #b42318;
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
            margin-top: 25px;
        }

        .detail-label {
            color: #777;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: 600;
        }

        .booking-footer {
            border-top: 1px solid #eee;
            margin-top: 25px;
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
        }

        .empty-state {
            background: white;
            text-align: center;
            padding: 60px 20px;
            border-radius: 14px;
        }

        .browse-btn {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 20px;
            background: #202735;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }

        @media (max-width: 650px) {
            .booking-details {
                grid-template-columns: 1fr 1fr;
            }
        }


        .car-info {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-top: 12px;
        }

        .booking-car-image {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            background: #f1f1f1;
        }

        .car-info h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        @media (max-width: 500px) {
            .booking-car-image {
                width: 110px;
                height: 80px;
            }

            .car-info h2 {
                font-size: 17px;
            }
        }


        .cancel-btn {
            background: #fff;
            color: #c62828;
            border: 1px solid #c62828;
            border-radius: 8px;
            padding: 12px 18px;
            font-weight: 600;
            cursor: pointer;
        }

        .cancel-btn:hover {
            background: #fff0f0;
        }

        .cancel-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }


    </style>
</head>

<body>

<!-- Existing navigation bar -->
<div th:replace="~{navbar :: navbar}"></div>

<div class="container">

    <h1>My Bookings</h1>
    <p class="subtitle">
        View your reservations and rental history.
    </p>

    <!-- Empty booking history -->
    <div class="empty-state"
         th:if="${#lists.isEmpty(bookings)}">

        <h2>No bookings yet!</h2>
        <p>Your future car rentals will appear here.</p>

        <a th:href="@{/cars}" class="browse-btn">
            Browse Cars
        </a>
    </div>

    <!-- Booking cards -->
    <div class="booking-card"
         th:each="booking : ${bookings}">

        <div class="booking-header">

            <div>
                <div class="booking-id"
                     th:text="'Booking #' + ${booking.bookingId}">
                    Booking #1
                </div>


                <div class="car-info">

                    <img class="booking-car-image"
                         th:src="${booking.car.imageUrl}"
                         alt="Booked car">

                    <div>
                        <h2 th:text="${booking.car.brand + ' ' + booking.car.model}">
                            Toyota Innova
                        </h2>

                        <div class="booking-id"
                             th:text="'Car ID: ' + ${booking.carId}">
                            Car ID: 5
                        </div>
                    </div>

                </div>


            </div>

            <span class="status"
                  th:classappend="${booking.bookingStatus == 'Confirmed'} ? ' confirmed' : (${booking.bookingStatus == 'Cancelled'} ? ' cancelled' : '')"
                  th:text="${booking.bookingStatus}">
                Confirmed
            </span>

        </div>

        <div class="booking-details">

            <div>
                <div class="detail-label">Pickup Date</div>
                <div class="detail-value"
                     th:text="${booking.pickupDate}">
                </div>
            </div>

            <div>
                <div class="detail-label">Return Date</div>
                <div class="detail-value"
                     th:text="${booking.returnDate}">
                </div>
            </div>

            <div>
                <div class="detail-label">Rental Mode</div>
                <div class="detail-value"
                     th:text="${booking.rentalMode}">
                </div>
            </div>

            <div>
                <div class="detail-label">Kilometre Package</div>
                <div class="detail-value"
                     th:text="${booking.kmPackage}">
                </div>
            </div>

            <div>
                <div class="detail-label">Payment Status</div>
                <div class="detail-value"
                     th:text="${booking.paymentStatus}">
                </div>
            </div>

            <div>
                <div class="detail-label">Daily Rate</div>
                <div class="detail-value"
                     th:text="'₹' + ${booking.dailyRate}">
                </div>
            </div>

        </div>

        <div class="booking-footer">

            <div>
                <div class="detail-label">Total Amount</div>
                <div class="total"
                     th:text="'₹' + ${booking.totalAmount}">
                </div>
            </div>


            <button
                    type="button"
                    class="cancel-btn"
                    th:if="${booking.bookingStatus != 'Cancelled'
        and booking.pickupDate.isAfter(T(java.time.LocalDate).now())}"
                    th:attr="data-booking-id=${booking.bookingId}"
                    onclick="cancelBooking(this)">

                Cancel Booking
            </button>

        </div>

    </div>

</div>

<script>

    async function cancelBooking(button) {

        const bookingId = button.dataset.bookingId;

        const confirmed = confirm(
            "Are you sure you want to cancel Booking #" +
            bookingId + "?"
        );

        if (!confirmed) return;

        const csrfToken = document.querySelector(
            'meta[name="_csrf"]'
        ).content;

        const csrfHeader = document.querySelector(
            'meta[name="_csrf_header"]'
        ).content;

        button.disabled = true;

        try {
            const response = await fetch("/booking/cancel", {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded",
                    [csrfHeader]: csrfToken
                },
                body: new URLSearchParams({
                    bookingId: bookingId
                })
            });

            const message = await response.text();

            if (!response.ok) {
                throw new Error(message);
            }

            alert(message);
            window.location.reload();

        } catch (error) {
            alert(error.message);
            button.disabled = false;
        }
    }

</script>

</body>
</html>
