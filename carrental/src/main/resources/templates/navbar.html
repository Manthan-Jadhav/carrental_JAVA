<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>

<body>

    <nav th:fragment="navbar" class="navbar">
        <div class="navbar-brand">CarRental</div>

        <div class="navbar-links">
            <a th:href="@{/(pickupDate=${pickupDate},returnDate=${returnDate},rentalMode=${rentalMode})}">Home</a>
            <a th:href="@{/cars}">Cars</a>

            <!-- Admin Panel Link -->
            <a th:if="${isAdmin}" th:href="@{/admin}" class="nav-admin-link">⚡ Admin Panel</a>

            <a th:if="${isAuthenticated}" th:href="@{/profile}">Profile</a>
            <a th:if="${isAuthenticated and not isAdmin}" th:href="@{/my-bookings}">My Bookings</a>

            <form th:if="${isAuthenticated}" th:action="@{/logout}" method="post" style="display:inline; margin:0;">
                <button type="submit" class="nav-logout-btn">Logout</button>
            </form>

            <!-- Unauthenticated Links -->
            <a th:unless="${isAuthenticated}" th:href="@{/login}">Login</a>
            <a th:unless="${isAuthenticated}" th:href="@{/register}">Register</a>
        </div>

        <style>
            .navbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 18px 35px;
                background: #172033;
                color: white;
                border-radius: 10px;
                margin: 15px 25px;
                box-sizing: border-box;
            }

            .navbar-brand {
                font-size: 24px;
                font-weight: bold;
                letter-spacing: 0.5px;
            }

            .navbar-links {
                display: flex;
                align-items: center;
                gap: 24px;
            }

            .navbar-links a {
                color: white;
                text-decoration: none;
                font-size: 16px;
                transition: color 0.2s;
            }

            .navbar-links a:hover {
                color: #60a5fa;
            }

            .nav-admin-link {
                background: #f59e0b;
                color: #0f172a !important;
                font-weight: bold;
                padding: 6px 14px;
                border-radius: 6px;
                transition: all 0.2s;
            }

            .nav-admin-link:hover {
                background: #d97706 !important;
                color: #ffffff !important;
            }

            .nav-logout-btn {
                background: #ef4444;
                color: white;
                border: none;
                padding: 8px 16px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 15px;
                font-weight: bold;
            }

            .nav-logout-btn:hover {
                background: #dc2626;
            }
        </style>
    </nav>

</body>

</html>
